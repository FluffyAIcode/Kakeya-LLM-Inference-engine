      - number-field and Hecke-L-function positivity criterion

  - id: hasanalizade-shen-wong-2021
    author: Elchin Hasanalizade, Quanli Shen, and Peng-Jie Wong
    title: Counting zeros of the Riemann zeta function
    venue: Journal of Number Theory (2021)
    url: https://doi.org/10.1016/j.jnt.2021.06.032
    authority: peer-reviewed
    used_for:
      - explicit Riemann-von Mangoldt zero-count estimate
      - shell-count growth sufficient for sums over zeta zeros
    notes: "For T >= e the paper proves an explicit error bounded by
      0.1038 log T + 0.2573 log log T + 9.3675 around the main
      Riemann-von Mangoldt term. The Lean obligation uses only the weaker
      resulting quadratic unit-shell count."

